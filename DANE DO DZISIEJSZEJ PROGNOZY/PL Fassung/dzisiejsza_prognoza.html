<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dzisiejsza prognoza</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #FAF7F2;
  --warm-dark: #2A1F14;
  --gold: #C4A55A;
  --gold-light: #F5EDD8;
  --muted: #8A7A6A;
  --border: rgba(42,31,20,0.10);
  --white: #FFFFFF;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--warm-dark);
  min-height: 100vh;
  padding: 0 0 4rem;
}

.container { max-width: 640px; margin: 0 auto; padding: 0 1.25rem; }

/* HEADER */
header {
  text-align: center;
  padding: 2.5rem 1.25rem 2rem;
  position: relative;
}
.header-label {
  font-size: 10px;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.6rem;
  font-weight: 500;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.2rem, 7vw, 3.2rem);
  font-weight: 300;
  color: var(--warm-dark);
  line-height: 1.1;
  margin-bottom: 0.5rem;
}
h1 em { font-style: italic; color: var(--gold); }
.today-label {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.3px;
}

/* DIVIDER */
.divider {
  width: 40px;
  height: 1px;
  background: var(--gold);
  margin: 1.5rem auto;
  opacity: 0.5;
}

/* MAIN CARD */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1rem;
  animation: fadeUp 0.5s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-top {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 1.75rem 1.75rem 1.5rem;
  border-bottom: 1px solid var(--border);
}

.number-circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 600;
  flex-shrink: 0;
  color: white;
}

.card-top-meta { flex: 1; }
.card-zodiak {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
  font-weight: 500;
}
.card-number-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 400;
  line-height: 1.2;
  color: var(--warm-dark);
}

.card-body { padding: 1.75rem; }

.energia {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  line-height: 1.85;
  font-style: italic;
  color: var(--warm-dark);
  margin-bottom: 1.75rem;
}

.grid2 {
  display: block;
  margin-bottom: 10px;
}
@media(max-width: 440px){ .grid2 { grid-template-columns: 1fr; } }

.ibox {
  background: var(--cream);
  border-radius: 8px;
  padding: 0.9rem 1rem;
}
.ibox-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 5px;
}
.ibox-val {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--warm-dark);
  line-height: 1.4;
}

.unikaj {
  background: #FFF9EF;
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  padding: 0.9rem 1.1rem;
  margin-top: 10px;
}
.unikaj .ibox-label { color: #B8902A; }
.unikaj .ibox-val   { color: #7A5C18; }

.slogan {
  text-align: center;
  padding: 1.4rem 1.75rem 1.5rem;
  border-top: 1px solid var(--border);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem;
  font-style: italic;
  font-weight: 300;
  color: var(--warm-dark);
}

/* DATE PICKER */
input[type="date"] {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--warm-dark);
  outline: none;
  transition: border-color 0.2s;
}
input[type="date"]:focus { border-color: var(--gold); }
.note {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 0.5rem;
}

.no-data {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 3rem 2rem;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

/* ENERGIA CHECK */

/* ── ENERGIA CHECK ── */
.echeck-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 1.75rem 1.5rem;
  margin-bottom: 1rem;
}
.echeck-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 400;
  color: var(--warm-dark);
  margin-bottom: 4px;
  text-align: center;
}
.echeck-sub {
  font-size: 12px;
  color: var(--warm-muted);
  text-align: center;
  margin-bottom: 1.5rem;
  letter-spacing: 0.3px;
}
.echeck-slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.25rem;
}
.echeck-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.2rem;
  font-weight: 600;
  min-width: 44px;
  text-align: center;
  transition: color 0.3s;
}
.echeck-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  outline: none;
  cursor: pointer;
  transition: background 0.3s;
}
.echeck-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gold);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(207,181,59,0.4);
}
.echeck-label-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--warm-muted);
  margin-bottom: 1.25rem;
  padding: 0 2px;
}
.echeck-result {
  border-radius: 14px;
  padding: 1.25rem;
  transition: all 0.4s;
  animation: fadeUp 0.3s ease;
}
.echeck-result.low  { background: #fef5f5; border: 1px solid #f5c6c6; }
.echeck-result.mid  { background: #fefdf0; border: 1px solid #f0e68c; }
.echeck-result.high { background: #f0faf0; border: 1px solid #a8dba8; }
.echeck-emoji { font-size: 2.2rem; margin-bottom: 8px; text-align: center; }
.echeck-msg {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  font-style: italic;
  font-weight: 400;
  text-align: center;
  margin-bottom: 10px;
  line-height: 1.6;
}
.echeck-result.low  .echeck-msg { color: #c0392b; }
.echeck-result.mid  .echeck-msg { color: #8a7a00; }
.echeck-result.high .echeck-msg { color: #27ae60; }
.echeck-tip {
  font-size: 13px;
  line-height: 1.8;
  text-align: center;
  padding: 0 4px;
}
.echeck-result.low  .echeck-tip { color: #a93226; }
.echeck-result.mid  .echeck-tip { color: #7a6a00; }
.echeck-result.high .echeck-tip { color: #1e8449; }

.energia-icon { font-size: 2.2rem; line-height: 1; }
.energia-msg {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  font-weight: 400;
}
.energia-bubble.low  .energia-msg { color: #A03030; }
.energia-bubble.high .energia-msg { color: #2E7020; }
/* NUM COLORS */

.date-text-input {
  padding: 10px 14px;
  border: 1px solid var(--border, rgba(42,31,20,0.12));
  border-radius: 8px;
  font-family: inherit;
  font-size: 16px;
  width: 100%;
  background: white;
  color: inherit;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  box-sizing: border-box;
}
.date-text-input:focus { border-color: #845EC2; }
.date-text-input::placeholder { color: #aaa; font-size: 14px; }


/* ── EMOCJE ── */
.emocje-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 1.75rem 1.5rem;
  margin-bottom: 1rem;
}
.emocje-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem;
  font-weight: 400;
  color: var(--warm-dark);
  margin-bottom: 4px;
  text-align: center;
}
.emocje-sub {
  font-size: 12px;
  color: var(--warm-muted);
  text-align: center;
  margin-bottom: 1.25rem;
  letter-spacing: 0.3px;
}
.emocje-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.emocje-input {
  flex: 1;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: 'Jost', sans-serif;
  font-size: 15px;
  color: var(--warm-dark);
  background: var(--beige-light, #f7f3ef);
  outline: none;
  transition: border-color 0.2s;
}
.emocje-input:focus { border-color: var(--violet); }
.emocje-input::placeholder { color: #bbb; }
.emocje-toggle {
  padding: 10px 14px;
  background: var(--violet-pale, #f0eaf8);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 12px;
  color: var(--violet);
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  font-weight: 500;
  transition: all 0.2s;
}
.emocje-toggle:hover { background: var(--violet); color: white; }
.emocje-saved {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-style: italic;
  color: var(--violet);
  margin-bottom: 10px;
  min-height: 24px;
  transition: all 0.3s;
}
.emocje-lista {
  display: none;
  margin-top: 8px;
  animation: fadeUp 0.3s ease;
}
.emocje-lista.on { display: block; }
.emocje-search {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  background: var(--beige-light, #f7f3ef);
  color: var(--warm-dark);
  outline: none;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.emocje-search:focus { border-color: var(--violet); }
.emocje-search::placeholder { color: #bbb; }
.emocje-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 260px;
  overflow-y: auto;
  padding: 4px 2px;
}
.emocje-grid::-webkit-scrollbar { width: 4px; }
.emocje-grid::-webkit-scrollbar-track { background: transparent; }
.emocje-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.emocja-pill {
  padding: 6px 13px;
  border-radius: 999px;
  font-size: 12px;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--warm-mid, #6b5a7a);
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.emocja-pill:hover { border-color: var(--violet); color: var(--violet); background: var(--violet-pale, #f0eaf8); }
.emocja-pill.neg { border-color: rgba(200,80,80,0.2); }
.emocja-pill.neg:hover { border-color: #c05050; color: #c05050; background: #fef5f5; }
.emocja-pill.pos { border-color: rgba(39,174,96,0.2); }
.emocja-pill.pos:hover { border-color: #27ae60; color: #27ae60; background: #f0faf0; }
.emocje-section-label {
  width: 100%;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--warm-muted);
  padding: 6px 2px 2px;
}

</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-label">Numerologia</div>
    <h1>Dzisiejsza<br><em>prognoza</em></h1>
    <div class="today-label" id="todayLabel"></div>
  </header>

  <div id="resultBox"></div>

  <div class="divider"></div>

  <div class="divider"></div>

  <div class="echeck-wrap">
    <div class="echeck-title">Jaka jest dziś Twoja energia?</div>
    <div class="echeck-sub">Przesuń suwak i sprawdź co dla Ciebie mamy ✨</div>
    <div class="echeck-slider-row">
      <span class="echeck-num" id="echeckNum" style="color:var(--warm-muted)">—</span>
      <input type="range" class="echeck-slider" id="echeckSlider" min="1" max="10" value="5"
             oninput="checkEnergia(this.value)" style="background:linear-gradient(to right,#845EC2 50%,#ede6dc 50%)"/>
    </div>
    <div class="echeck-label-row"><span>😴 1</span><span>😐 5</span><span>🔥 10</span></div>
    <div id="echeckResult"></div>
  </div>

  <div class="emocje-wrap">
    <div class="emocje-title">Co teraz czujesz?</div>
    <div class="emocje-sub">Nazwanie emocji to pierwszy krok do zrozumienia siebie ✦</div>
    <div class="emocje-saved" id="emocjeSaved"></div>
    <div class="emocje-input-row">
      <input class="emocje-input" type="text" id="emocjeInput"
             placeholder="Wpisz lub wybierz z listy..."
             oninput="filterEmocje(this.value)"
             onkeydown="if(event.key==='Enter')saveEmocja()"/>
      <button class="emocje-toggle" onclick="toggleLista()">📋 Lista</button>
    </div>
    <div class="emocje-lista" id="emocjeLista">
      <input class="emocje-search" type="text" id="emocjeSearch"
             placeholder="🔍 Szukaj emocji..."
             oninput="filterEmocje(this.value)"/>
      <div class="emocje-grid" id="emocjeGrid"></div>
    </div>
  </div>

</div>

<script>

const EMOCJE_NEG = ["agresja", "antypatia", "apatia", "awersja", "bezradność", "bezsilność", "ból", "cierpienie", "depresja", "dyskomfort", "frustracja", "furia", "gniew", "gorycz", "groza", "irytacja", "lęk", "litość", "melancholia", "napięcie", "nerwowość", "niechęć", "niemoc", "nienawiść", "nieszczęście", "nieufność", "nuda", "obawa", "oburzenie", "osamotnienie", "panika", "pogarda", "poirytowanie", "przerażenie", "przygnębienie", "przykrość", "przytłoczenie", "rozczarowanie", "rozdrażnienie", "rozgoryczenie", "rozpacz", "samotność", "smutek", "spięcie", "strach", "stres", "tęsknota", "upokorzenie", "wina", "wrogość", "wstyd", "wściekłość", "zakłopotanie", "załamanie", "zazdrość", "zdenerwowanie", "zdesperowanie", "złość", "zmęczenie", "zniechęcenie", "żal"];
const EMOCJE_POS = ["akceptacja", "bezpieczeństwo", "bliskość", "cisza", "czułość", "dobrostan", "duma", "energia", "entuzjazm", "euforia", "harmonia", "inspiracja", "lekkość", "miłość", "motywacja", "nadzieja", "odwaga", "pewność siebie", "pogoda ducha", "radość", "spokój", "szczęście", "ulga", "uważność", "wdzięczność", "zachwyt", "zadowolenie", "zaufanie", "zrozumienie", "życzliwość", "ciekawość", "kreatywność"];
const BIERNIK = {"agresja": "agresję", "antypatia": "antypatię", "apatia": "apatię", "awersja": "awersję", "bezradność": "bezradność", "bezsilność": "bezsilność", "ból": "ból", "cierpienie": "cierpienie", "depresja": "depresję", "dyskomfort": "dyskomfort", "duma": "dumę", "frustracja": "frustrację", "furia": "furię", "gniew": "gniew", "gorycz": "gorycz", "groza": "grozę", "irytacja": "irytację", "lęk": "lęk", "litość": "litość", "melancholia": "melancholię", "napięcie": "napięcie", "nerwowość": "nerwowość", "niechęć": "niechęć", "niemoc": "niemoc", "nienawiść": "nienawiść", "nieszczęście": "nieszczęście", "nieufność": "nieufność", "nuda": "nudę", "obawa": "obawę", "oburzenie": "oburzenie", "osamotnienie": "osamotnienie", "panika": "panikę", "pogarda": "pogardę", "poirytowanie": "poirytowanie", "przerażenie": "przerażenie", "przygnębienie": "przygnębienie", "przykrość": "przykrość", "przytłoczenie": "przytłoczenie", "rozczarowanie": "rozczarowanie", "rozdrażnienie": "rozdrażnienie", "rozgoryczenie": "rozgoryczenie", "rozpacz": "rozpacz", "samotność": "samotność", "smutek": "smutek", "spięcie": "spięcie", "strach": "strach", "stres": "stres", "tęsknota": "tęsknotę", "upokorzenie": "upokorzenie", "wina": "winę", "wrogość": "wrogość", "wstyd": "wstyd", "wściekłość": "wściekłość", "zakłopotanie": "zakłopotanie", "załamanie": "załamanie", "zazdrość": "zazdrość", "zdenerwowanie": "zdenerwowanie", "zdesperowanie": "zdesperowanie", "złość": "złość", "zmęczenie": "zmęczenie", "zniechęcenie": "zniechęcenie", "żal": "żal", "akceptacja": "akceptację", "bezpieczeństwo": "bezpieczeństwo", "bliskość": "bliskość", "cisza": "ciszę", "czułość": "czułość", "dobrostan": "dobrostan", "energia": "energię", "entuzjazm": "entuzjazm", "euforia": "euforię", "harmonia": "harmonię", "inspiracja": "inspirację", "lekkość": "lekkość", "miłość": "miłość", "motywacja": "motywację", "nadzieja": "nadzieję", "odwaga": "odwagę", "pewność siebie": "pewność siebie", "pogoda ducha": "pogodę ducha", "radość": "radość", "spokój": "spokój", "szczęście": "szczęście", "ulga": "ulgę", "uważność": "uważność", "wdzięczność": "wdzięczność", "zachwyt": "zachwyt", "zadowolenie": "zadowolenie", "zaufanie": "zaufanie", "zrozumienie": "zrozumienie", "życzliwość": "życzliwość", "ciekawość": "ciekawość", "kreatywność": "kreatywność"};
function biernikVal(v) { return BIERNIK[v.toLowerCase()] || v; }

let listaOpen = false;

function buildEmocjeGrid(filter) {
  var grid = document.getElementById('emocjeGrid');
  if (!grid) return;
  var f = (filter||'').toLowerCase().trim();
  var neg = EMOCJE_NEG.filter(function(e){return !f||e.toLowerCase().includes(f);});
  var pos = EMOCJE_POS.filter(function(e){return !f||e.toLowerCase().includes(f);});
  var html = '';
  if (neg.length) {
    html += '<div class="emocje-section-label">Trudne emocje</div>';
    html += neg.map(function(e){
      return '<button class="emocja-pill neg" onclick="pickEmocja(\''+e+'\')">'+e+'</button>';
    }).join('');
  }
  if (pos.length) {
    html += '<div class="emocje-section-label">Przyjemne emocje</div>';
    html += pos.map(function(e){
      return '<button class="emocja-pill pos" onclick="pickEmocja(\''+e+'\')">'+e+'</button>';
    }).join('');
  }
  if (!neg.length && !pos.length) {
    html = '<div style="font-size:13px;color:#bbb;padding:1rem;text-align:center;">Nie znaleziono emocji</div>';
  }
  grid.innerHTML = html;
}

function toggleLista() {
  listaOpen = !listaOpen;
  var lista = document.getElementById('emocjeLista');
  lista.classList.toggle('on', listaOpen);
  if (listaOpen) {
    buildEmocjeGrid('');
    document.getElementById('emocjeSearch').focus();
  }
}

function filterEmocje(val) {
  if (!listaOpen) { listaOpen = true; document.getElementById('emocjeLista').classList.add('on'); }
  buildEmocjeGrid(val);
  // Synchronizuj oba pola
  document.getElementById('emocjeInput').value = val;
  document.getElementById('emocjeSearch').value = val;
}

function pickEmocja(e) {
  document.getElementById('emocjeInput').value = e;
  saveEmocja();
  listaOpen = false;
  document.getElementById('emocjeLista').classList.remove('on');
}

function saveEmocja() {
  var val = document.getElementById('emocjeInput').value.trim();
  if (!val) return;
  var saved = document.getElementById('emocjeSaved');

    saved.innerHTML =
      '<span style="color:#845EC2;font-style:italic">Zanotowano: ' + val + '</span>' +

      '<div style="font-size:13px;line-height:1.85;color:#6b5a7a;margin-bottom:10px;">' +

      'Powiedz: <strong style="color:#845EC2">czuję ' + biernikVal(val) + '</strong> — to DWA słowa, które dają Ci ulgę i chronią drugą osobę.' +
      '</div>' +
      '<div style="font-size:12px;line-height:1.7;color:#9b8aaa;font-style:italic;margin-bottom:10px;">' +

      '</div>' +
      '<div style="font-size:13px;line-height:1.85;color:#6b5a7a;">' +
      '<strong style="color:#845EC2">2.</strong> Napisz list — opisz całą historię i emocje które jej towarzyszą. Wszystko, bez cenzury. ' +

      '🇵🇱 <strong style="color:#6b5a7a;">Polska — Telefon Zaufania:</strong> <strong style="color:#845EC2">116 123</strong> (całodobowy, bezpłatny)<br/>' +
      '🇩🇪 <strong style="color:#6b5a7a;">Deutschland — Ärztlicher Bereitschaftsdienst:</strong> <strong style="color:#845EC2">116 117</strong> (całodobowy, bezpłatny)' +
      '</div>' +
      '</div>';
  } else {
    saved.textContent = 'Zanotowano: ' + val + ' ✦';
  }
  saved.style.opacity = '1';
}


function parseDate(val) {
  val = val.trim();
  // DD.MM.YYYY lub DD-MM-YYYY
  var m = val.match(/^(\d{1,2})[.\-](\d{1,2})[.\-](\d{4})$/);
  if (m) return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
  // YYYY-MM-DD
  m = val.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return val;
  return null;
}
function validateDate(val) {
  var iso = parseDate(val);
  if (!iso) return null;
  var d = new Date(iso + 'T12:00:00');
  if (isNaN(d.getTime())) return null;
  return iso;
}

const DNI = {"3-21":{"z":"Baran","l":8,"e":"Ósemka w dniu równonocy wiosennej to potężna energia manifestacji, która zachęca do zasiewania intencji sukcesu i obfitości. Twoja wewnętrzna moc budzi się teraz do życia wraz z całą naturą, dając Ci siłę do realizacji najbardziej ambitnych planów.","r":"Podejmij konkretne działania mające na celu stabilizację Twoich finansów oraz pozycji zawodowej. Zaufaj swojej sprawczości i buduj trwałe struktury, które będą służyć Ci przez kolejne miesiące.","n":"Refleksja, Głębia, Intuicja","u":"Wystrzegaj się lęku przed porażką oraz braku wiary we własne, niemal nieograniczone możliwości. Nie pozwól, by chwilowe trudności osłabiły Twój entuzjazm i determinację w dążeniu do celu.","s":"Pytanie jest ważniejsze niż odpowiedź","fun":"Masz dziś w sobie tyle determinacji, że nawet wiosenne porządki wykonujesz z precyzją dyrektora generalnego."},"3-22":{"z":"Baran","l":9,"e":"Dziewiątka przypomina, że aby móc w pełni przyjąć nową energię wiosny, należy najpierw pożegnać to, co stare i niepotrzebne. To czas wielkiego oczyszczenia duszy, który przynosi ulgę i przygotowuje grunt pod nowe, fascynujące doświadczenia.","r":"Wybacz dawnym urazom i puść wolno relacje, które przestały wnosić światło do Twojej codzienności. Podziękuj sobie za dotychczasową drogę, uznając każde doświadczenie za cenny element Twojej mądrości.","n":"Realizacja, Sukces, Sprawczość","u":"Nie trzymaj się kurczowo przeszłości, ponieważ blokuje to Twój naturalny proces odrodzenia i transformacji. Unikaj smutku po tym, co mija, bo każde zakończenie jest obietnicą lepszego jutra.","s":"Moc służy, nie dominuje","fun":"Twoje dzisiejsze porządki są tak radykalne, że nawet kurz boi się osiadać na półkach w Twojej obecności."},"3-23":{"z":"Baran","l":1,"e":"Jedynka to potężny impuls do nowego początku, który sprawia, że czujesz się autentyczną architektką własnego losu. To idealny moment, abyś zainicjowała projekt, o którym do tej pory bałaś się nawet głośno marzyć.","r":"Postaw na siebie i podejmij samodzielną decyzję, która zmieni Twój dotychczasowy sposób patrzenia na życie. Zaufaj swojej intuicji pionierki i nie bój się przecierać nowych, nieodkrytych jeszcze szlaków.","n":"Transformacja, Mądrość, Służba","u":"Wystrzegaj się czekania na pozwolenie ze strony innych, ponieważ tylko Ty wiesz, co jest dla Ciebie najlepsze. Nie pozwól, by bierność zgasiła ogień inicjatywy, który dzisiaj płonie w Twoim sercu wyjątkowo mocno.","s":"Zamknij z gracją — otwórz z wdzięcznością","fun":"Twój entuzjazm jest dziś tak zaraźliwy, że mogłabyś poprowadzić tłumy, idąc po prostu po poranne pieczywo."},"3-24":{"z":"Baran","l":2,"e":"Dwójka uczy nas, że największa siła drzemie w umiejętności słuchania oraz budowania harmonijnych relacji z otoczeniem. Twoja dyplomacja stanie się dziś kluczem, który otworzy przed Tobą drzwi do serc i umysłów ważnych dla Ciebie ludzi.","r":"Szukaj porozumienia i buduj mosty tam, gdzie do tej pory panowały chłód, dystans lub niepotrzebne uprzedzenia. Pielęgnuj swoją intuicję, ponieważ ona najlepiej podpowie Ci, jak zachować równowagę w kontaktach z innymi.","n":"Nowe początki, Inicjatywa, Przywództwo","u":"Unikaj konfliktów oraz narzucania swojej woli, co mogłoby zburzyć kruchą atmosferę dzisiejszej zgody. Nie bój się prosić o wsparcie, ponieważ współpraca przyniesie Ci znacznie więcej korzyści niż samotne działanie.","s":"Twoja droga, Twój rytm","fun":"Jesteś dziś tak wyczulona na nastroje innych, że rozumiesz nawet to, co Twój kot próbuje przekazać Ci swoim mruczeniem."},"3-25":{"z":"Baran","l":3,"e":"Trójka to radosna celebracja życia, która zamienia każdy zwykły moment w barwną opowieść pełną inspiracji. Pozwól sobie na śmiech i lekkie podejście do wyzwań, ponieważ radość jest najpotężniejszym narzędziem kreacji, jakie posiadasz.","r":"Wyraź siebie poprzez sztukę, słowo lub po prostu radosną rozmowę z kimś, kto potrzebuje dziś wsparcia. Dziel się swoim optymizmem i zainspiruj innych do dostrzegania piękna w najmniejszych detalach rzeczywistości.","n":"Relacje, Intuicja, Współpraca","u":"Wystrzegaj się nadmiernej powagi oraz zamartwiania się sprawami, na które nie masz dzisiaj realnego wpływu. Nie tłum swojej kreatywności w obawie przed oceną, ponieważ świat potrzebuje Twojego unikalnego blasku.","s":"Delikatność to siła","fun":"Twoja aura jest dziś tak radosna, że nawet Twoja kawa wydaje się smakować bardziej słońcem niż kofeiną."},"3-26":{"z":"Baran","l":4,"e":"Czwórka przypomina o wartości solidnych fundamentów, na których budujemy poczucie własnego bezpieczeństwa i stabilizacji. Twoja dzisiejsza systematyczność zostanie doceniona, przynosząc Ci wewnętrzny spokój i satysfakcję z dobrze wykonanej pracy.","r":"Skup się na dokończeniu rozpoczętych projektów i zadbaj o porządek w sprawach, które wymagają rzetelnego podejścia. Buduj swoją przyszłość krok po kroku, ufając, że każda mała czynność przybliża Cię do wielkiego sukcesu.","n":"Twórczość, Ekspresja, Radość","u":"Unikaj chaosu oraz podejmowania zbyt wielu wyzwań jednocześnie, co mogłoby niepotrzebnie rozproszyć Twoją uwagę. Nie lekceważ zasad, które chronią Twoją stabilność i pomagają Ci zachować kontrolę nad życiem.","s":"Lżej znaczy dalej","fun":"Twoja dzisiejsza miłość do porządku sprawia, że nawet spinacze w Twoim biurku ułożyły się w idealne szeregi."},"3-27":{"z":"Baran","l":5,"e":"Piątka przynosi powiew świeżości i zachęca do wyjścia poza bezpieczną, ale czasem zbyt przewidywalną strefę komfortu. To doskonały dzień, abyś odważyła się na zmianę, która wprowadzi do Twojej codzienności nową, ożywczą energię.","r":"Otwórz się na spontaniczne propozycje i pozwól sobie na odrobinę przygody, która odświeży Twój umysł. Zaryzykuj i sprawdź nowe możliwości rozwoju, które pojawiają się na Twoim horyzoncie właśnie dzisiaj.","n":"Organizacja, Konsekwencja, Stabilność","u":"Wystrzegaj się nudy oraz stagnacji, które mogą działać na Ciebie wyjątkowo frustrująco i odbierać Ci siły. Nie bój się porzucić starych schematów, ponieważ to właśnie w zmianie drzemie największy potencjał Twojego wzrostu.","s":"Solidność to poezja","fun":"Twoja potrzeba wolności jest dziś tak duża, że nawet spacer do lokalnego sklepu wydaje się początkiem wielkiej wyprawy."},"3-28":{"z":"Baran","l":6,"e":"Szóstka zaprasza Cię do świata harmonii, gdzie miłość, troska i piękno stanowią najważniejsze drogowskazy dnia. Zadbaj o to, by Twoje działania płynęły prosto z serca i niosły ukojenie zarówno Tobie, jak i Twoim najbliższym.","r":"Stwórz w swoim domu atmosferę pełną ciepła i spędź czas z osobami, które są Ci najbliższe. Skup się na tworzeniu pięknych chwil, które wzmocnią Twoje więzi i dadzą Ci poczucie bycia kochaną.","n":"Zmiany, Odkrycia, Wolność","u":"Unikaj brania na swoje barki zbyt wielu cudzych problemów, ponieważ każdy musi przejść swoją drogę samodzielnie. Nie szukaj perfekcji tam, gdzie wystarczy po prostu szczera obecność i dobre, wspierające słowo.","s":"Wolność jest decyzją","fun":"Twoja chęć opiekowania się światem sprawia, że nawet Twoje kwiaty doniczkowe czują się dziś wyjątkowo rozpieszczane."},"3-29":{"z":"Baran","l":7,"e":"Siódemka to czas introspekcji, w którym cisza staje się Twoim najbardziej lojalnym i mądrym sprzymierzeńcem. Pozwól sobie na luksus bycia sam na sam ze swoimi myślami, aby odnaleźć odpowiedzi na najważniejsze pytania duszy.","r":"Znajdź chwilę na medytację lub spokojną lekturę, która pozwoli Ci pogłębić wiedzę o sobie samej. Zaufaj swojej intuicji, ponieważ w dzisiejszym wyciszeniu jej głos będzie słyszalny wyjątkowo wyraźnie.","n":"Troska, Harmonia, Piękno","u":"Stroń od zgiełku i powierzchownych rozrywek, które mogą rozproszyć Twoją cenną uwagę i zabrać spokój. Nie bój się pytań o sens życia, gdyż konfrontacja z nimi przyniesie Ci upragnioną wolność ducha.","s":"Piękno jest aktem odwagi","fun":"Twoje milczenie jest dziś tak wymowne, że Twoi bliscy zastanawiają się, czy właśnie nie odkryłaś nowej galaktyki."},"3-30":{"z":"Baran","l":8,"e":"Ósemka wzywa Cię do wykazania się siłą charakteru oraz odwagą w zarządzaniu własnymi zasobami i energią. Twoja sprawczość jest dziś na najwyższym poziomie, co pozwala Ci skutecznie domykać nawet najbardziej skomplikowane projekty finansowe.","r":"Podejmij inicjatywę w sprawach zawodowych i nie bój się sięgać po należne Ci nagrody oraz uznanie. Buduj swój autorytet na fundamentach uczciwości i rzetelności, które zawsze były Twoją mocną stroną.","n":"Refleksja, Głębia, Intuicja","u":"Nie podejmuj decyzji w pośpiechu ani pod wpływem negatywnych emocji, które mogłyby zamglić Twój osąd. Wystrzegaj się arogancji, pamiętając, że prawdziwa moc przejawia się w spokoju i pewności podejmowanych działań.","s":"Pytanie jest ważniejsze niż odpowiedź","fun":"Masz dziś spojrzenie liderki, przed którą ustępują nawet największe przeciwności losu i kolejki na poczcie."},"3-31":{"z":"Baran","l":9,"e":"Dziewiątka zamyka marzec w tonie mądrości i podsumowań, pozwalając Ci spojrzeć na minione tygodnie z właściwym dystansem. To doskonały moment na wyciągnięcie wniosków i zrobienie miejsca na nową energię, którą przyniesie kolejny miesiąc.","r":"Dokończ wszystkie rozpoczęte sprawy i z wdzięcznością pożegnaj to, co w Twoim życiu już się dopełniło. Podaruj sobie chwilę na podziękowanie losowi za wszystkie lekcje, które odebrałaś w ciągu minionego kwartału.","n":"Realizacja, Sukces, Sprawczość","u":"Nie trzymaj się kurczowo spraw, które już nie służą Twojemu rozwojowi, lecz otwórz dłonie, by przyjąć nowe dary. Unikaj smutku po tym, co odchodzi, ponieważ każda zmiana jest koniecznym krokiem ku lepszemu życiu.","s":"Moc służy, nie dominuje","fun":"Jesteś dziś jak mądra sowa kończąca ważny rozdział, gotowa na zupełnie nową i fascynującą przygodę."},"4-1":{"z":"Baran","l":6,"e":"Szóstka w dniu 1 kwietnia wnosi energię odpowiedzialności i głębokiej troski, która chroni nas przed powierzchownością primaaprilisowych żartów. To doskonały czas na budowanie harmonii w relacjach z najbliższymi oraz dbanie o to, by w Twoim domu zapanował spokój i wzajemne zaufanie.","r":"Skup się na potrzebach swojej rodziny i stwórz dla nich atmosferę pełną ciepła. Zrób coś pięknego dla siebie lub swojego otoczenia, co wzmocni Twoje poczucie wewnętrznej równowagi.","n":"Troska, Harmonia, Piękno","u":"Wystrzegaj się brania na siebie zbyt wielu cudzych problemów, bo może to przytłoczyć Twoją własną radość życia. Nie pozwól, by drobne uszczypliwości zburzyły harmonię, którą tak starannie pielęgnujesz.","s":"Dom to miejsce gdzie serce oddycha","fun":"Twoje dzisiejsze żarty są tak pełne empatii, że nikt nawet nie czuje się nabrany, a raczej wyjątkowo zaopiekowany."},"4-2":{"z":"Baran","l":7,"e":"Siódemka zaprasza Cię dziś do wycofania się z hałaśliwego świata i poszukiwania odpowiedzi w głębokiej, wewnętrznej ciszy. To czas kontemplacji, w którym Twoja intuicja podpowie Ci rozwiązania niedostępne dla chłodnej, logicznej analizy.","r":"Znajdź chwilę na medytację lub spokojną lekturę, która pozwoli Ci odnaleźć duchową ścieżkę. Zaufaj ciszy, ponieważ to właśnie w niej rodzą się najbardziej wartościowe i trwałe przemyślenia.","n":"Refleksja, Głębia, Intuicja","u":"Unikaj zbędnego zgiełku oraz powierzchownych rozmów, które mogą rozproszyć Twoją cenną uwagę. Nie spiesz się z podejmowaniem decyzji, zanim nie poczujesz pełnej zgodności ze swoim wnętrzem.","s":"W ciszy mieszka mądrość","fun":"Twoja dzisiejsza aura tajemniczości jest tak silna, że nawet Twoja poranna kawa wydaje się parować w jakimś mistycznym rytmie."},"4-3":{"z":"Baran","l":8,"e":"Ósemka to potężna energia manifestacji, która pozwala Ci realnie wpłynąć na strukturę Twojego życia zawodowego i finansowego. Twoja determinacja staje się dziś narzędziem sukcesu, o ile tylko pozostaniesz wierna swoim najwyższym wartościom.","r":"Podejmij konkretne działania w stronę realizacji ambitnych celów i zaufaj swojej sprawczej mocy. Buduj swoją obfitość na fundamentach uczciwości, co zapewni Ci trwałe i satysfakcjonujące rezultaty.","n":"Realizacja, Sukces, Sprawczość","u":"Wystrzegaj się lęku przed ryzykiem oraz braku wiary w swoje niemal nieograniczone możliwości. Nie podejmuj decyzji w oparciu o chwilowe emocje, lecz kieruj się długofalową wizją rozwoju.","s":"Siła z wartości, nie z ego","fun":"Masz dziś spojrzenie liderki, która potrafi wynegocjować lepszą cenę nawet przy zakupie bułek w lokalnym sklepie."},"4-4":{"z":"Baran","l":9,"e":"Dziewiątka symbolizuje domykanie pewnego cyklu doświadczeń, co pozwala Ci z wdzięcznością spojrzeć na przebytą do tej pory drogę. To czas wielkiej transformacji i uwalniania się od tego, co już dawno przestało służyć Twojemu najwyższemu dobru.","r":"Wybacz dawnym urazom i puść wolno relacje, które blokują Twoją naturalną, życiową ekspansję. Podziękuj przeszłości za wszystkie odebrane lekcje i zrób w swoim sercu miejsce na nowe dary.","n":"Transformacja, Mądrość, Służba","u":"Nie trzymaj się kurczowo tego, co już mija, ponieważ każde zakończenie jest obietnicą nowego świtu. Unikaj smutku po tym, co odchodzi, uznając to za konieczny etap Twojego duchowego wzrostu.","s":"Koniec to też dar","fun":"Robisz dziś takie porządki emocjonalne, że nawet stare paragony w Twoim portfelu same proszą o godną utylizację."},"4-5":{"z":"Baran","l":1,"e":"Jedynka po fali oczyszczenia przynosi iskrę nowej inicjatywy i zachęca do stanięcia w pełnym blasku własnej autentyczności. To dzień, w którym każda Twoja odważna myśl ma moc stania się początkiem nowej, niezwykłej historii.","r":"Postaw na siebie i zainicjuj projekt, o którym do tej pory bałaś się nawet głośno marzyć. Zaufaj swojej sile przebicia i bądź pierwszą osobą, która z pełnym przekonaniem uwierzy w Twoje zwycięstwo.","n":"Nowe początki, Inicjatywa, Przywództwo","u":"Wystrzegaj się oglądania na opinie innych ludzi, ponieważ tylko Ty znasz kierunek, w którym pragniesz podążać. Nie zwlekaj z działaniem, gdyż dzisiejsza energia sprzyja tym, którzy odważnie ruszają w nieznane.","s":"Pierwsza linia należy do Ciebie","fun":"Twój entuzjazm jest dziś tak wielki, że mogłabyś zainicjować nową modę, idąc po prostu do pracy w jednym bucie."},"4-6":{"z":"Baran","l":2,"e":"Dwójka uczy nas, że największa siła często drzemie w łagodności oraz umiejętności współistnienia z drugim człowiekiem. Twoja dyplomacja stanie się dziś kluczem, który otworzy przed Tobą drzwi do serc i umysłów ważnych dla Ciebie osób.","r":"Szukaj porozumienia i buduj mosty tam, gdzie do tej pory panował chłód lub niepotrzebny dystans. Pielęgnuj swoją intuicję, ponieważ ona najlepiej podpowie Ci, jak zachować równowagę w relacjach.","n":"Relacje, Intuicja, Współpraca","u":"Unikaj rywalizacji oraz narzucania swojej woli, co mogłoby zburzyć kruchą atmosferę dzisiejszej zgody. Nie bój się prosić o wsparcie, ponieważ współpraca przyniesie Ci dziś znacznie więcej korzyści.","s":"W ciszy słychać więcej","fun":"Jesteś dziś tak wyczulona na nastroje innych, że wiesz dokładnie, o czym marzą Twoi bliscy, zanim sami o tym pomyślą."},"4-7":{"z":"Baran","l":3,"e":"Trójka to radosny taniec kreatywności, który zamienia każdy zwykły obowiązek w fascynującą przygodę pełną inspiracji. Pozwól sobie na śmiech i lekkie podejście do życia, ponieważ radość jest najkrótszą drogą do spełnienia marzeń.","r":"Wyraź swoje emocje poprzez barwy, słowa lub gesty, które niosą ze sobą powiew świeżości. Dziel się swoim optymizmem, bo Twój szczery uśmiech ma dziś moc zarażania innych dobrą energią.","n":"Twórczość, Ekspresja, Radość","u":"Nadmiernego analizowania swoich potknięć, co mogłoby niepotrzebnie stłumić Twój naturalny entuzjazm. Nie pozwól, by pesymizm otoczenia zgasił Twój wewnętrzny, radosny blask, który dziś tak mocno świeci.","s":"Śmiech to najkrótsza droga do serca","fun":"Twoja energia jest dziś tak słoneczna, że nawet kwiaty w wazonie wydają się nachylać w Twoją stronę."},"4-8":{"z":"Baran","l":4,"e":"Czwórka przypomina o wartości solidnych fundamentów, na których budujemy poczucie własnego bezpieczeństwa i stabilizacji. Twoja systematyczność zostanie dziś doceniona, przynosząc Ci spokój i satysfakcję z rzetelnie wykonanej pracy.","r":"Skup się na dokończeniu rozpoczętych projektów i zadbaj o porządek w sprawach wymagających uwagi. Buduj swoją przyszłość krok po kroku, ufając, że każda mała czynność przybliża Cię do wielkiego sukcesu.","n":"Organizacja, Konsekwencja, Stabilność","u":"Unikaj chaosu oraz podejmowania zbyt wielu wyzwań jednocześnie, co mogłoby rozproszyć Twoją uwagę. Nie lekceważ zasad, które chronią Twoją stabilność i pomagają zachować kontrolę nad rzeczywistością.","s":"Fundament nie hałasuje — ale wszystko na nim stoi","fun":"Twoja dzisiejsza miłość do porządku sprawia, że nawet spinacze w Twoim biurku ułożyły się w idealne szeregi."},"4-9":{"z":"Baran","l":5,"e":"Piątka przynosi powiew wolności i zachęca do wyjścia poza bezpieczną, ale czasem zbyt przewidywalną strefę komfortu. To doskonały dzień, abyś odważyła się na zmianę, która wprowadzi do Twojej codzienności nową energię.","r":"Otwórz się na spontaniczne propozycje i pozwól sobie na odrobinę przygody, która odświeży Twój umysł. Zaryzykuj i sprawdź nowe możliwości rozwoju, które pojawiają się na horyzoncie właśnie dzisiaj.","n":"Zmiany, Odkrycia, Wolność","u":"Wystrzegaj się nudy oraz stagnacji, które mogą działać na Ciebie wyjątkowo frustrująco i odbierać siły. Nie bój się porzucić starych schematów, ponieważ to właśnie w zmianie drzemie Twój największy potencjał.","s":"Wiatr nie pyta — on po prostu wieje","fun":"Twoja potrzeba zmian jest dziś tak duża, że wyjście na spacer może skończyć się rezerwacją biletów na koniec świata."},"4-10":{"z":"Baran","l":6,"e":"Szóstka ponownie zaprasza Cię do świata harmonii, gdzie miłość, troska i piękno stanowią najważniejsze drogowskazy. Zadbaj o to, by Twoje działania płynęły prosto z serca i niosły ukojenie zarówno Tobie, jak i bliskim.","r":"Stwórz w swoim domu atmosferę pełną ciepła i spędź czas z osobami, które są dla Ciebie najważniejsze. Skup się na tworzeniu pięknych chwil, które wzmocnią Twoje więzi i dadzą Ci poczucie bezpieczeństwa.","n":"Troska, Harmonia, Piękno","u":"Unikaj brania na swoje barki zbyt wielu cudzych problemów, ponieważ każdy musi przejść swoją drogę samodzielnie. Nie szukaj perfekcji tam, gdzie wystarczy po prostu szczera obecność i dobre, wspierające słowo.","s":"Dom to miejsce gdzie serce oddycha","fun":"Twoja chęć opiekowania się światem sprawia, że nawet Twoje kwiaty doniczkowe czują się dziś wyjątkowo rozpieszczane."},"4-11":{"z":"Baran","l":7,"e":"Siódemka otwiera przed Tobą przestrzeń do głębokich studiów nad własną naturą oraz sensem podejmowanych działań. To dzień, w którym intelekt harmonijnie spotyka się z duchowością, tworząc idealne warunki do odkrywania nieoczywistych prawd o świecie.","r":"Poświęć czas na rozwijanie swoich pasji oraz poszukiwanie odpowiedzi w ciszy własnego umysłu. Zaufaj intuicji, ponieważ to właśnie w wyciszeniu rodzą się najbardziej wartościowe i trwałe pomysły na przyszłość.","n":"Refleksja, Głębia, Intuicja","u":"Wystrzegaj się powierzchowności oraz ulegania presji otoczenia, która zmusza do udzielania szybkich i nieprzemyślanych odpowiedzi. Nie uciekaj od trudnych pytań, gdyż konfrontacja z nimi przyniesie Ci upragnioną wolność ducha.","s":"W ciszy mieszka mądrość","fun":"Twoja aura tajemniczości jest dziś tak silna, że nawet Twoja ulubiona książka wydaje się otwierać na właściwej stronie sama z siebie."},"4-12":{"z":"Baran","l":8,"e":"Ósemka wzywa Cię do wykazania się odwagą w zarządzaniu własnym życiem oraz zasobami, którymi dysponujesz na co dzień. Twoja sprawczość znajduje się dziś na najwyższym poziomie, co pozwala Ci skutecznie domykać nawet najbardziej skomplikowane projekty.","r":"Podejmij odważną inicjatywę w sprawach zawodowych i nie bój się sięgać po należne Ci uznanie oraz sukces. Buduj swój autorytet na fundamentach uczciwości, ponieważ tylko rzetelne działania przynoszą trwałe i godne owoce.","n":"Realizacja, Sukces, Sprawczość","u":"Nie podejmuj decyzji w pośpiechu ani pod wpływem negatywnych emocji, które mogłyby na chwilę zamglić Twój osąd. Wystrzegaj się arogancji, pamiętając, że prawdziwa moc nie potrzebuje krzyku, by zostać zauważoną przez innych.","s":"Siła z wartości, nie z ego","fun":"Masz dziś spojrzenie liderki, przed którą ustępują nawet największe przeciwności losu i biurokratyczne przeszkody w urzędach."},"4-13":{"z":"Baran","l":9,"e":"Dziewiątka zaprasza do wielkiego sprzątania – nie tylko w przestrzeni fizycznej, ale przede wszystkim w sferze Twoich emocji. To doskonały czas na podsumowanie dotychczasowych lekcji i przygotowanie się do wielkiego otwarcia na nowe, wiosenne dary.","r":"Dokończ wszystkie rozpoczęte sprawy i z wdzięcznością zamknij te rozdziały, które nie wnoszą już światła do Twojej codzienności. Okaż sercu przebaczenie, uznając każde dotychczasowe doświadczenie za cenny element Twojej unikalnej mądrości.","n":"Transformacja, Mądrość, Służba","u":"Nie trzymaj się kurczowo przeszłości oraz relacji, które swoją obecnością jedynie blokują Twój naturalny i piękny rozwój. Unikaj smutku po tym, co odchodzi, bo każde zakończenie jest konieczną obietnicą zupełnie nowego świtu.","s":"Koniec to też dar","fun":"Masz dziś taki rozmach w domykaniu spraw, że nawet kurz ucieka z Twojego domu, zanim zdążysz o nim pomyśleć."},"4-14":{"z":"Baran","l":1,"e":"Jedynka to świeży powiew energii, który sprawia, że znów czujesz się autentyczną architektką własnego losu. Każdy Twój dzisiejszy wybór ma moc zmieniania rzeczywistości na lepszą i bardziej zgodną z Twoim wewnętrznym głosem.","r":"Postaw na oryginalność i nie bój się zaprezentować światu swoich najbardziej śmiałych oraz innowacyjnych projektów. Zaufaj swojej sile i bądź pierwszą osobą, która z pełnym przekonaniem uwierzy w powodzenie dzisiejszych działań.","n":"Nowe początki, Inicjatywa, Przywództwo","u":"Wystrzegaj się naśladownictwa oraz szukania dróg na skróty, które mogłyby niepotrzebnie osłabić Twoją autentyczność. Nie bój się działać samodzielnie, ponieważ pionierzy często muszą przecierać szlaki bez oglądania się na innych.","s":"Pierwsza linia należy do Ciebie","fun":"Jesteś dziś taką dawką czystej energii, że mogłabyś zastąpić poranne espresso dla całego swojego biura lub bliskich."},"4-15":{"z":"Baran","l":2,"e":"Dwójka uczy nas, że największe sukcesy osiągamy wtedy, gdy potrafimy połączyć siły z innymi w duchu wzajemnego szacunku. Twoja dyplomacja oraz wyjątkowe wyczucie nastrojów pozwolą Ci dziś rozładować każdą, nawet najbardziej napiętą sytuację.","r":"Słuchaj uważnie tego, co mówią inni i szukaj punktów wspólnych, które staną się solidnym fundamentem zgody. Pielęgnuj swoją intuicję, ponieważ ona podpowie Ci dzisiaj, komu warto zaufać i powierzyć swoje cenne sekrety.","n":"Relacje, Intuicja, Współpraca","u":"Unikaj izolacji oraz chowania się w cieniu, gdy Twoja łagodna obecność może przynieść ulgę potrzebującym osobom. Nie bój się wyrażać własnego zdania, nawet jeśli Twoim nadrzędnym celem jest dziś budowanie powszechnej harmonii.","s":"W ciszy słychać więcej","fun":"Jesteś dziś tak dobrym słuchaczem, że nawet Twoje kwiaty doniczkowe wydają się nachylać w Twoją stronę podczas rozmowy."},"4-16":{"z":"Baran","l":3,"e":"Trójka to radosny manifest Twojej twórczej duszy, która pragnie ekspresji i celebracji każdej pięknej, kwietniowej chwili. Świat potrzebuje dzisiaj Twojego uśmiechu oraz lekkości, którą wnosisz w życie wszystkich napotkanych na drodze osób.","r":"Pozwól sobie na zabawę słowem i formą, inspirując innych do radosnego patrzenia na wyzwania codzienności. Dziel się swoim entuzjazmem i nie bój się być w centrum uwagi, jeśli służy to szerzeniu dobrej energii.","n":"Twórczość, Ekspresja, Radość","u":"Wystrzegaj się plotek oraz marnowania czasu na jałowe dyskusje, które nie przynoszą nikomu realnego pożytku. Nie pozwól, by drobne uszczypliwości ze strony otoczenia zgasiły Twój wewnętrzny, radosny blask, który dziś promieniuje.","s":"Śmiech to najkrótsza droga do serca","fun":"Twoja kreatywność nie zna dziś granic, więc nawet zwykła sałatka na obiad może wyglądać jak dzieło sztuki nowoczesnej."},"4-17":{"z":"Baran","l":4,"e":"Czwórka przypomina, że prawdziwa wolność wyrasta z poczucia bezpieczeństwa i solidnie zbudowanych podstaw codziennego życia. Twoja dzisiejsza systematyczność zostanie doceniona i przyniesie Ci spokój, o którym od dawna marzyłaś w głębi serca.","r":"Zadbaj o porządek w dokumentach i dopracuj szczegóły, które do tej pory wydawały Ci się mało istotne. Buduj swoją przyszłość cegła po cegle, pamiętając, że pośpiech jest zazwyczaj złym doradcą przy stawianiu fundamentów.","n":"Organizacja, Konsekwencja, Stabilność","u":"Unikaj chaosu oraz podejmowania zbyt wielu wyzwań jednocześnie, co mogłoby niepotrzebnie rozproszyć Twoją cenną uwagę. Nie lekceważ procedur i zasad, które służą ochronie Twoich interesów oraz zapewnieniu trwałości Twoich dokonań.","s":"Fundament nie hałasuje — ale wszystko na nim stoi","fun":"Twój dzisiejszy poziom zorganizowania sprawia, że nawet czas płynie dokładnie tak, jak zaplanowałaś to w swoim kalendarzu."},"4-18":{"z":"Baran","l":5,"e":"Piątka przynosi dynamiczne zmiany, które wymagają od Ciebie elastyczności oraz gotowości do szybkiego podejmowania nowych decyzji. To dzień pełen niespodzianek, które mogą całkowicie odmienić Twoje dotychczasowe postrzeganie wielu ważnych spraw.","r":"Zaakceptuj pojawiające się okazje i bądź gotowa na zmianę kierunku, jeśli poczujesz, że nowa droga jest lepsza. Wyjdź do ludzi i otwórz się na wymianę myśli, która może zainspirować Cię do podjęcia śmiałych czynów.","n":"Zmiany, Odkrycia, Wolność","u":"Wystrzegaj się lęku przed nieznanym oraz trzymania się kurczowo planów, które już przestały być w pełni aktualne. Nie bój się zaryzykować, ponieważ dziś szczęście sprzyja tym, którzy mają odwagę łamać dotychczasowe schematy.","s":"Wiatr nie pyta — on po prostu wieje","fun":"Masz dziś w sobie tyle pasji podróżnika, że nawet wyjście do lokalnego sklepu wydaje się początkiem wielkiej wyprawy."},"4-19":{"z":"Baran","l":6,"e":"Szóstka zaprasza Cię do budowania mostów miłości i troski, które łączą serca Twoich najbliższych w jedną harmonijną całość. Twoja wrażliwość na piękno sprawi, że każde dzisiejsze spotkanie stanie się okazją do wzmocnienia wzajemnych więzi.","r":"Zadbaj o estetykę swojego bezpośredniego otoczenia i pozwól, by harmonia zagościła w Twoim domu na stałe. Okaż czułość osobom, które kochasz, ponieważ proste gesty mają dziś wielką moc uzdrawiania dawnych, drobnych ran.","n":"Troska, Harmonia, Piękno","u":"Unikaj brania na swoje barki zbyt wielu cudzych problemów, ponieważ każdy musi przejść swoją drogę samodzielnie. Nie szukaj perfekcji tam, gdzie wystarczy po prostu szczera obecność i dobre, wspierające słowo płynące z serca.","s":"Dom to miejsce gdzie serce oddycha","fun":"Twoje poczucie harmonii jest dziś tak wielkie, że nawet poduszki na kanapie same układają się w idealną linię."},"4-20":{"z":"Byk","l":7,"e":"Siódemka zamyka tę dekadę w tonie kontemplacji, zachęcając do głębokiego podsumowania dotychczasowych kwietniowych doświadczeń. To czas, w którym wiedza intuicyjna staje się Twoim najcenniejszym kapitałem i drogowskazem na nadchodzące dni.","r":"Znajdź chwilę na zapisanie swoich przemyśleń i wsłuchaj się w rytm natury, która właśnie w pełni rozkwita. Zaufaj procesom dojrzewania, które dzieją się w Twoim wnętrzu, i daj sobie czas na przygotowanie do nowych wyzwań.","n":"Refleksja, Głębia, Intuicja","u":"Wystrzegaj się hałasu oraz niepotrzebnego pośpiechu w planowaniu kolejnych kroków zawodowych czy osobistych. Nie lekceważ snów i drobnych znaków, które dziś mogą być dla Ciebie wyjątkowo czytelne oraz istotne.","s":"W ciszy mieszka mądrość","fun":"Jesteś dziś jak mądra sowa, która z boku obserwuje świat, zachowując przy tym stoicki spokój oraz właściwy dystans."},"4-21":{"z":"Byk","l":8,"e":"Ósemka to potężna fala energii, która sprzyja manifestowaniu Twoich najśmielszych wizji w świecie materii. To dzień, w którym Twoja wewnętrzna siła spotyka się z odpowiednimi okolicznościami, pozwalając Ci na odważne sięgnięcie po to, na co rzetelnie zapracowałaś.","r":"Podejmij kluczowe decyzje finansowe i wykaż się determinacją w realizacji zawodowych założeń. Zaufaj swojej sprawczej mocy, która dziś działa wyjątkowo skutecznie i precyzyjnie.","n":"Realizacja, Sukces, Sprawczość","u":"Wystrzegaj się lęku przed sukcesem oraz niepewności, która mogłaby podkopać Twój autorytet w oczach innych. Nie ulegaj pokusie dominacji za wszelką cenę, pamiętając, że prawdziwa moc płynie z wewnętrznego spokoju.","s":"Siła z wartości, nie z ego","fun":"Twoja dzisiejsza pewność siebie sprawia, że nawet najtrudniejsze zadania na liście „do zrobienia” wykonują się niemal same."},"4-22":{"z":"Byk","l":9,"e":"Dziewiątka przypomina, że mądrość polega na umiejętności domykania etapów, które wypełniły już swoje przeznaczenie. To czas wielkiego, wiosennego oczyszczenia duszy, które przygotowuje Cię na przyjęcie zupełnie nowych, fascynujących impulsów od losu.","r":"Podziękuj przeszłości za wszystkie odebrane lekcje i z pełną świadomością puść wolno to, co Cię ogranicza. Zrób w swoim sercu przestrzeń na nowe doświadczenia, które pojawią się wraz z nadchodzącym majem.","n":"Transformacja, Mądrość, Służba","u":"Nie trzymaj się kurczowo relacji i spraw, które przestały wnosić światło do Twojej codzienności. Unikaj rozpamiętywania strat, ponieważ każde zakończenie jest obietnicą nowego, wspaniałego świtu.","s":"Koniec to też dar","fun":"Masz dziś taki rozmach w domykaniu spraw, że nawet kurz w zakamarkach szafy czuje się poważnie zagrożony eksmisją."},"4-23":{"z":"Byk","l":1,"e":"Jedynka po raz kolejny rozpala iskrę nowej inicjatywy, zachęcając Cię do stanięcia w pełnym blasku własnych możliwości. To dzień, w którym każda Twoja odważna myśl może stać się fundamentem dla nowej, niezwykłej historii, którą napiszesz sama.","r":"Wykaż się samodzielnością i zainicjuj projekt, o którym do tej pory bałaś się nawet głośno marzyć. Zaufaj swojej sile przebicia i bądź pierwszą osobą, która z pełnym przekonaniem uwierzy w Twoje dzisiejsze zwycięstwo.","n":"Nowe początki, Inicjatywa, Przywództwo","u":"Wystrzegaj się oglądania na opinie innych ludzi, ponieważ tylko Ty znasz kierunek, w którym pragniesz podążać. Nie zwlekaj z działaniem, gdyż dzisiejsza energia sprzyja tym, którzy odważnie i bez wahania ruszają w nieznane.","s":"Pierwsza linia należy do Ciebie","fun":"Twój entuzjazm jest dziś tak wielki, że mogłabyś zainicjować nową modę, idąc po prostu do pracy w jednym bucie i z wielkim uśmiechem."},"4-24":{"z":"Byk","l":2,"e":"Dwójka uczy nas, że największa siła często drzemie w łagodności oraz umiejętności budowania harmonijnych relacji. Twoja dyplomacja stanie się dziś kluczem, który otworzy przed Tobą drzwi do serc i umysłów ważnych dla Ciebie osób.","r":"Szukaj porozumienia i buduj mosty porozumienia tam, gdzie do tej pory panował chłodny dystans. Pielęgnuj swoją intuicję, ponieważ ona najlepiej podpowie Ci, jak zachować równowagę w kontaktach z innymi.","n":"Relacje, Intuicja, Współpraca","u":"Unikaj rywalizacji oraz narzucania swojej woli, co mogłoby zburzyć kruchą atmosferę dzisiejszej zgody. Nie bój się prosić o wsparcie, ponieważ współpraca przyniesie Ci dziś znacznie więcej korzyści niż samotne działanie.","s":"W ciszy słychać więcej","fun":"Jesteś dziś tak wyczulona na nastroje innych, że wiesz dokładnie, o czym marzą Twoi bliscy, zanim sami o tym pomyślą."},"4-25":{"z":"Byk","l":3,"e":"Trójka to radosny taniec kreatywności, który zamienia każdy zwykły obowiązek w fascynującą przygodę pełną inspiracji. Pozwól sobie na śmiech i lekkie podejście do życia, ponieważ radość jest najkrótszą drogą do spełnienia Twoich marzeń.","r":"Wyraź swoje emocje poprzez barwy, słowa lub gesty, które niosą ze sobą powiew wiosennej świeżości. Dziel się swoim optymizmem, bo Twój szczery uśmiech ma dziś moc zarażania innych wyjątkowo dobrą energią.","n":"Twórczość, Ekspresja, Radość","u":"Nadmiernego analizowania swoich potknięć, co mogłoby niepotrzebnie stłumić Twój naturalny, dziecięcy entuzjazm. Nie pozwól, by pesymizm otoczenia zgasił Twój wewnętrzny blask, który dziś promieniuje wyjątkowo mocno.","s":"Śmiech to najkrótsza droga do serca","fun":"Twoja energia jest dziś tak słoneczna, że nawet kwiaty w wazonie wydają się nachylać w Twoją stronę, szukając blasku."},"4-26":{"z":"Byk","l":4,"e":"Czwórka przypomina o wartości solidnych fundamentów, na których budujemy poczucie własnego bezpieczeństwa i życiowej stabilizacji. Twoja systematyczność zostanie dziś doceniona, przynosząc Ci spokój oraz wielką satysfakcję z rzetelnie wykonanej pracy.","r":"Skup się na dokończeniu rozpoczętych projektów i zadbaj o wzorowy porządek w sprawach wymagających uwagi. Buduj swoją przyszłość krok po kroku, ufając, że każda mała czynność przybliża Cię do wielkiego sukcesu.","n":"Organizacja, Konsekwencja, Stabilność","u":"Unikaj chaosu oraz podejmowania zbyt wielu wyzwań jednocześnie, co mogłoby niepotrzebnie rozproszyć Twoją cenną uwagę. Nie lekceważ zasad, które chronią Twoją stabilność i pomagają zachować pełną kontrolę nad rzeczywistością.","s":"Fundament nie hałasuje — ale wszystko na nim stoi","fun":"Twoja dzisiejsza miłość do porządku sprawia, że nawet spinacze w Twoim biurku ułożyły się w idealne, równe szeregi."},"4-27":{"z":"Byk","l":5,"e":"Piątka przynosi ożywczy powiew wolności i zachęca do wyjścia poza bezpieczną, ale czasem zbyt przewidywalną strefę komfortu. To doskonały dzień, abyś odważyła się na zmianę, która wprowadzi do Twojej codzienności nową, stymulującą energię.","r":"Otwórz się na spontaniczne propozycje i pozwól sobie na odrobinę przygody, która odświeży Twój umysł. Zaryzykuj i sprawdź nowe możliwości rozwoju, które pojawiają się na horyzoncie właśnie dzisiejszego dnia.","n":"Zmiany, Odkrycia, Wolność","u":"Wystrzegaj się nudy oraz stagnacji, które mogą działać na Ciebie frustrująco i niepotrzebnie odbierać Ci siły witalne. Nie bój się porzucić starych schematów, ponieważ to właśnie w zmianie drzemie Twój największy potencjał wzrostu.","s":"Wiatr nie pyta — on po prostu wieje","fun":"Twoja potrzeba zmian jest dziś tak duża, że wyjście na zwykły spacer może skończyć się rezerwacją biletów na koniec świata."},"4-28":{"z":"Byk","l":6,"e":"Szóstka ponownie zaprasza Cię do świata harmonii, gdzie miłość, troska i piękno stanowią najważniejsze drogowskazy dla serca. Zadbaj o to, by Twoje działania płynęły prosto z wnętrza i niosły ukojenie zarówno Tobie, jak i wszystkim bliskim.","r":"Stwórz w swoim domu atmosferę pełną ciepła i spędź czas z osobami, które są dla Ciebie najważniejsze. Skup się na tworzeniu pięknych chwil, które wzmocnią Twoje więzi i dadzą Ci poczucie głębokiego bezpieczeństwa.","n":"Troska, Harmonia, Piękno","u":"Unikaj brania na swoje barki zbyt wielu cudzych problemów, ponieważ każdy musi przejść swoją życiową drogę samodzielnie. Nie szukaj perfekcji tam, gdzie wystarczy po prostu szczera obecność i dobre, wspierające słowo płynące z duszy.","s":"Dom to miejsce gdzie serce oddycha","fun":"Twoja chęć opiekowania się światem sprawia, że nawet Twoje kwiaty doniczkowe czują się dziś wyjątkowo rozpieszczane i kochane."},"4-29":{"z":"Byk","l":7,"e":"Siódemka to czas głębokiej introspekcji, kiedy cisza staje się Twoim najbardziej lojalnym nauczycielem życiowej mądrości. Wyciszenie zewnętrznych bodźców pozwoli Ci usłyszeć odpowiedzi, których od dawna poszukiwałaś w świecie zewnętrznym.","r":"Znajdź chwilę na medytację lub spokojną lekturę, która wzbogaci Twoje wnętrze i przyniesie spokój umysłu. Zaufaj swojej intuicji, ponieważ jej głos jest dzisiaj wyjątkowo czysty, klarowny i godny zaufania.","n":"Refleksja, Głębia, Intuicja","u":"Hałasu oraz powierzchownych rozrywek, które mogą rozproszyć Twoją uwagę i zabrać wypracowany z trudem spokój. Nie bój się pytań o sens własnej drogi, gdyż konfrontacja z nimi przynosi prawdziwe wyzwolenie i duchowy wzrost.","s":"W ciszy mieszka mądrość","fun":"Twoja aura tajemniczości sprawia, że bliscy zastanawiają się, czy właśnie nie odnalazłaś odpowiedzi na wszystkie zagadki wszechświata."},"4-30":{"z":"Byk","l":8,"e":"Ósemka zamyka kwiecień mocnym akcentem sprawczości, przypominając Ci o Twojej zdolności do panowania nad materią i własnym losem. To dzień, w którym możesz z dumą podsumować swoje osiągnięcia i przygotować fundamenty pod nadchodzącą energię maja.","r":"Skoncentruj się na domykaniu spraw zawodowych i finansowych, wykazując się przy tym dużą dozą profesjonalizmu. Zamanifestuj swoją obfitość i z ufnością spójrz w przyszłość, wiedząc, że masz w ręku wszystkie niezbędne asy.","n":"Realizacja, Sukces, Sprawczość","u":"Niepewności oraz osiadania na laurach, ponieważ Twoja energia sukcesu potrzebuje ciągłego, świadomego podtrzymywania. Wystrzegaj się lęku przed wielkością, gdyż jesteś w pełni gotowa na owoce, które właśnie dojrzewają w Twoim ogrodzie.","s":"Siła z wartości, nie z ego","fun":"Twój portfel czuje dziś przed Tobą taki respekt, że nawet paragony układają się w nim w idealnym porządku alfabetycznym."},"5-1":{"z":"Byk","l":7,"e":"Siódemka to czas introspekcji, w którym cisza staje się Twoim najbardziej lojalnym i mądrym sprzymierzeńcem. Pozwól sobie na luksus bycia sam na sam ze swoimi myślami, aby odnaleźć odpowiedzi na najważniejsze pytania duszy.","r":"Znajdź chwilę na medytację lub spokojną lekturę, która pozwoli Ci pogłębić wiedzę o sobie samej. Zaufaj swojej intuicji, ponieważ w dzisiejszym wyciszeniu jej głos będzie słyszalny wyjątkowo wyraźnie.","n":"Refleksja, Głębia, Intuicja","u":"Stroń od zgiełku i powierzchownych rozrywek, które mogą rozproszyć Twoją cenną uwagę i zabrać spokój. Nie bój się pytań o sens życia, gdyż konfrontacja z nimi przyniesie Ci upragnioną wolność ducha.","s":"Głębiej niż widać","fun":"Twoje milczenie jest dziś tak wymowne, że Twoi bliscy zastanawiają się, czy właśnie nie odkryłaś nowej galaktyki."},"5-2":{"z":"Byk","l":8,"e":"Ósemka to potężna manifestacja siły i sprawczości, która doskonale współgra z energią świętowania i dumy. Masz dziś w ręku wszystkie narzędzia, aby Twoje działania nabrały rozmachu i przyniosły wymierne, materialne owoce.","r":"Podejmij odważną inicjatywę i zaufaj swojej zdolności do panowania nad skomplikowanymi procesami. Buduj swoją pozycję na fundamencie uczciwości, co zapewni Ci szacunek otoczenia i trwałość osiągniętych sukcesów.","n":"Realizacja, Sukces, Sprawczość","u":"Wystrzegaj się podejmowania decyzji pod wpływem lęku, zamiast czerpać siłę z poczucia własnej, ogromnej wartości. Nie ulegaj arogancji, pamiętając, że prawdziwa moc zawsze idzie w parze z wewnętrznym opanowaniem.","s":"Budujesz — i to zostaje","fun":"Masz dziś spojrzenie liderki, przed którą ustępują nawet największe korki na trasach majówkowych wycieczek."},"5-3":{"z":"Byk","l":9,"e":"Dziewiątka przypomina, że każde zakończenie jest koniecznym etapem, który przygotowuje nas na nadejście czegoś zupełnie nowego. To czas wielkiej transformacji i uwalniania się od ciężarów przeszłości, aby z lekkim sercem ruszyć dalej.","r":"Wybacz dawnym urazom i podziękuj przeszłości za wszystkie lekcje, które Cię ukształtowały. Zrób w swoim życiu miejsce na nowe idee, które już teraz zaczynają kiełkować w Twojej wyobraźni.","n":"Transformacja, Mądrość, Służba","u":"Nie trzymaj się kurczowo spraw, które wypełniły już swoje przeznaczenie i przestały wspierać Twój wzrost. Unikaj żalu po tym, co odchodzi, ponieważ każda zmiana jest obietnicą lepszej i mądrzejszej przyszłości.","s":"Mądrość boli zanim wyzwala","fun":"Robisz dziś takie porządki emocjonalne, że nawet stare paragony w portfelu same proszą o godną i szybką utylizację."},"5-4":{"z":"Byk","l":1,"e":"Jedynka po raz kolejny rozpala iskrę nowej inicjatywy, zachęcając Cię do bycia pionierką we własnym, codziennym życiu. To dzień, w którym każda Twoja odważna myśl ma moc stania się początkiem fascynującej, nowej przygody.","r":"Postaw na siebie i zainicjuj projekt, o którym do tej pory bałaś się głośno opowiadać innym. Zaufaj swojej sile przebicia i bądź pierwszą osobą, która z pełnym przekonaniem uwierzy w Twoje dzisiejsze zwycięstwo.","n":"Nowe początki, Inicjatywa, Przywództwo","u":"Wystrzegaj się oglądania na opinie innych ludzi, ponieważ tylko Ty znasz właściwy kierunek swojej podróży. Nie zwlekaj z działaniem, gdyż dzisiejsza energia sprzyja tym, którzy odważnie i zdecydowanie ruszają w nieznane.","s":"Zacznij — reszta przyjdzie","fun":"Twój entuzjazm jest dziś tak wielki, że mogłabyś zainicjować nową modę, idąc po prostu do pracy w jednym bucie."},"5-5":{"z":"Byk","l":2,"e":"Dwójka uczy nas, że największa siła często drzemie w łagodności oraz umiejętności słuchania drugiego człowieka. Twoja dyplomacja stanie się dziś kluczem, który otworzy przed Tobą drzwi do serc i umysłów ważnych dla Ciebie osób.","r":"Szukaj porozumienia i buduj mosty tam, gdzie do tej pory panował chłodny, nieprzyjemny dystans. Pielęgnuj swoją intuicję, ponieważ ona najlepiej podpowie Ci, jak zachować równowagę w kontaktach z otoczeniem.","n":"Relacje, Intuicja, Współpraca","u":"Unikaj rywalizacji oraz narzucania swojej woli, co mogłoby zburzyć kruchą atmosferę dzisiejszej zgody. Nie bój się prosić o wsparcie, ponieważ współpraca przyniesie Ci dziś znacznie więcej korzyści niż samotne działanie.","s":"Dwie dusze, jedna harmonia","fun":"Jesteś dziś tak wyczulona na nastroje innych, że wiesz dokładnie, o czym marzą Twoi bliscy, zanim sami o tym pomyślą."},"5-6":{"z":"Byk","l":3,"e":"Trójka to radosny taniec kreatywności, który zamienia każdy zwykły obowiązek w barwną opowieść pełną inspiracji. Pozwól sobie na śmiech i lekkie podejście do życia, ponieważ radość jest najkrótszą drogą do spełnienia marzeń.","r":"Wyraź swoje emocje poprzez barwy, słowa lub gesty, które niosą ze sobą powiew wiosennej świeżości. Dziel się swoim optymizmem, bo Twój szczery uśmiech ma dziś moc zarażania innych wyjątkowo dobrą energią.","n":"Twórczość, Ekspresja, Radość","u":"Nadmiernego analizowania swoich potknięć, co mogłoby niepotrzebnie stłumić Twój naturalny, radosny entuzjazm. Nie pozwól, by pesymizm otoczenia zgasił Twój wewnętrzny blask, który dziś promieniuje wyjątkowo mocno.","s":"Twórz, bo świat tego potrzebuje","fun":"Twoja energia jest dziś tak słoneczna, że nawet kwiaty w wazonie wydają się nachylać w Twoją stronę."},"5-7":{"z":"Byk","l":4,"e":"Czwórka przypomina o wartości solidnych fundamentów, na których budujemy poczucie własnego bezpieczeństwa i stabilizacji. Twoja systematyczność zostanie dziś doceniona, przynosząc Ci spokój oraz satysfakcję z rzetelnie wykonanej pracy.","r":"Skup się na dokończeniu rozpoczętych projektów i zadbaj o porządek w sprawach wymagających uwagi. Buduj swoją przyszłość krok po kroku, ufając, że każda mała czynność przybliża Cię do wielkiego sukcesu.","n":"Organizacja, Konsekwencja, Stabilność","u":"Unikaj chaosu oraz podejmowania zbyt wielu wyzwań jednocześnie, co mogłoby niepotrzebnie rozproszyć Twoją uwagę. Nie lekceważ zasad, które chronią Twoją stabilność i pomagają zachować kontrolę nad rzeczywistością.","s":"Małe kroki, trwałe ślady","fun":"Twoja dzisiejsza miłość do porządku sprawia, że nawet spinacze w Twoim biurku ułożyły się w idealne szeregi."},"5-8":{"z":"Byk","l":5,"e":"Piątka przynosi powiew wolności i zachęca do wyjścia poza bezpieczną, ale czasem zbyt przewidywalną strefę komfortu. To doskonały dzień, abyś odważyła się na zmianę, która wprowadzi do Twojej codzienności nową energię.","r":"Otwórz się na spontaniczne propozycje i pozwól sobie na odrobinę przygody, która odświeży Twój umysł. Zaryzykuj i sprawdź nowe możliwości rozwoju, które pojawiają się na horyzoncie właśnie dzisiaj.","n":"Zmiany, Odkrycia, Wolność","u":"Wystrzegaj się nudy oraz stagnacji, które mogą działać na Ciebie frustrująco i odbierać siły. Nie bój się porzucić starych schematów, ponieważ to właśnie w zmianie drzemie Twój największy potencjał.","s":"Każda zmiana to zaproszenie","fun":"Twoja potrzeba zmian jest dziś tak duża, że wyjście na spacer może skończyć się rezerwacją biletów na koniec świata."},"5-9":{"z":"Byk","l":6,"e":"Szóstka ponownie zaprasza Cię do świata harmonii, gdzie miłość, troska i piękno stanowią najważniejsze drogowskazy. Zadbaj o to, by Twoje działania płynęły prosto z serca i niosły ukojenie zarówno Tobie, jak i bliskim.","r":"Stwórz w swoim domu atmosferę pełną ciepła i spędź czas z osobami, które są dla Ciebie najważniejsze. Skup się na tworzeniu pięknych chwil, które wzmocnią Twoje więzi i dadzą Ci poczucie bezpieczeństwa.","n":"Troska, Harmonia, Piękno","u":"Unikaj brania na swoje barki zbyt wielu cudzych problemów, ponieważ każdy musi przejść swoją drogę samodzielnie. Nie szukaj perfekcji tam, gdzie wystarczy po prostu szczera obecność i dobre, wspierające słowo.","s":"Troska zmienia wszystko","fun":"Twoja chęć opiekowania się światem sprawia, że nawet Twoje kwiaty doniczkowe czują się dziś wyjątkowo rozpieszczane."},"5-10":{"z":"Byk","l":7,"e":"Siódemka otwiera przed Tobą drzwi do wewnętrznej biblioteki wiedzy, gdzie odpowiedzi na najtrudniejsze pytania pojawiają się same w ciszy. To czas, w którym intelekt harmonijnie łączy się z intuicją, tworząc idealną przestrzeń do studiowania własnej duszy oraz otaczającego świata.","r":"Poświęć czas na rozwijanie swoich pasji i poszukaj mądrości w ciszy, z dala od codziennego pośpiechu. Zaufaj wiedzy, która przychodzi w momentach wyciszenia, gdyż jest ona najcenniejszym drogowskazem na nadchodzące dni.","n":"Refleksja, Głębia, Intuicja","u":"Wystrzegaj się powierzchowności oraz ulegania presji otoczenia, która zmusza do szybkich i nieprzemyślanych odpowiedzi. Nie bój się pytań o sens własnej drogi, gdyż konfrontacja z nimi przynosi prawdziwe wyzwolenie i duchowy wzrost.","s":"Głębiej niż widać","fun":"Twoja dzisiejsza aura tajemniczości jest tak silna, że nawet Twoja poranna kawa wydaje się parować w jakimś mistycznym, filozoficznym rytmie."},"5-11":{"z":"Byk","l":8,"e":"Ósemka to potężna energia sprawczości, która pozwala Ci realnie wpłynąć na strukturę Twojego życia zawodowego oraz finansowego. Masz w sobie wystarczająco dużo determinacji, aby zre
