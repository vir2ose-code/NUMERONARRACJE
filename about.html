<!-- ══ INLINE STAR GENERATION ══ -->
<script>
(function() {
  const starsEl = document.getElementById('stars');
  if (!starsEl) return;
  const count = 80;
  let html = '';
  for (let i = 0; i < count; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const size = Math.random() * 2.5 + 0.5;
    const dur = (Math.random() * 4 + 2).toFixed(1);
    const delay = (Math.random() * 5).toFixed(1);
    const minOp = (Math.random() * 0.2 + 0.1).toFixed(2);
    const maxOp = (Math.random() * 0.5 + 0.4).toFixed(2);
    html += `<div class="star" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;--dur:${dur}s;--delay:${delay}s;--min-op:${minOp};--max-op:${maxOp};"></div>`;
  }
  starsEl.innerHTML = html;
})();
</script>
