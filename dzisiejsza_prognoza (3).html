<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dzisiejsza prognoza</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #FAF7F2;
  --warm-dark: #2A1F14;
  --gold: #C4A55A;
  --gold-light: #F5EDD8;
  --muted: #8A7A6A;
  --border: rgba(42,31,20,0.10);
  --white: #FFFFFF;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--warm-dark);
  min-height: 100vh;
  padding: 0 0 4rem;
}

.container { max-width: 640px; margin: 0 auto; padding: 0 1.25rem; }

/* HEADER */
header {
  text-align: center;
  padding: 2.5rem 1.25rem 2rem;
  position: relative;
}
.header-label {
  font-size: 10px;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.6rem;
  font-weight: 500;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.2rem, 7vw, 3.2rem);
  font-weight: 300;
  color: var(--warm-dark);
  line-height: 1.1;
  margin-bottom: 0.5rem;
}
h1 em { font-style: italic; color: var(--gold); }
.today-label {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.3px;
}

/* DIVIDER */
.divider {
  width: 40px;
  height: 1px;
  background: var(--gold);
  margin: 1.5rem auto;
  opacity: 0.5;
}

/* MAIN CARD */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1rem;
  animation: fadeUp 0.5s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-top {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 1.75rem 1.75rem 1.5rem;
  border-bottom: 1px solid var(--border);
}

.number-circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 600;
  flex-shrink: 0;
  color: white;
}

.card-top-meta { flex: 1; }
.card-zodiak {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
  font-weight: 500;
}
.card-number-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 400;
  line-height: 1.2;
  color: var(--warm-dark);
}

.card-body { padding: 1.75rem; }

.energia {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  line-height: 1.85;
  font-style: italic;
  color: var(--warm-dark);
  margin-bottom: 1.75rem;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
@media(max-width: 440px){ .grid2 { grid-template-columns: 1fr; } }

.ibox {
  background: var(--cream);
  border-radius: 8px;
  padding: 0.9rem 1rem;
}
.ibox-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 5px;
}
.ibox-val {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--warm-dark);
  line-height: 1.4;
}

.unikaj {
  background: #FFF9EF;
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  padding: 0.9rem 1.1rem;
  margin-top: 10px;
}
.unikaj .ibox-label { color: #B8902A; }
.unikaj .ibox-val   { color: #7A5C18; }

.slogan {
  text-align: center;
  padding: 1.4rem 1.75rem 1.5rem;
  border-top: 1px solid var(--border);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem;
  font-style: italic;
  font-weight: 300;
  color: var(--warm-dark);
}

/* DATE PICKER */
input[type="date"] {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--warm-dark);
  outline: none;
  transition: border-color 0.2s;
}
input[type="date"]:focus { border-color: var(--gold); }
.note {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 0.5rem;
}

.no-data {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 3rem 2rem;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

/* ENERGIA CHECK */
.energia-check {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.75rem;
  text-align: center;
  margin-bottom: 1rem;
}
.energia-check-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem;
  font-weight: 400;
  color: var(--warm-dark);
  margin-bottom: 4px;
}
.energia-check-sub {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.5px;
  margin-bottom: 1.25rem;
}
.energia-slider-row {
  display: flex;
  justify-content: center;
}
.energia-slider-row input[type="number"] {
  width: 90px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--warm-dark);
  text-align: center;
  outline: none;
  background: var(--cream);
  transition: border-color 0.2s;
  -moz-appearance: textfield;
}
.energia-slider-row input[type="number"]::-webkit-inner-spin-button,
.energia-slider-row input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
.energia-slider-row input[type="number"]:focus { border-color: var(--gold); }
.energia-result {
  margin-top: 1.25rem;
  animation: fadeUp 0.35s ease both;
}
.energia-result.show { display: block; }
.energia-bubble {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 1.1rem 2rem;
  border-radius: 12px;
  min-width: 180px;
}
.energia-bubble.low  { background: #FFF3F3; border: 1px solid #FFCACA; }
.energia-bubble.high { background: #F2FAF0; border: 1px solid #B8DFB0; }
.energia-icon { font-size: 2.2rem; line-height: 1; }
.energia-msg {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  font-weight: 400;
}
.energia-bubble.low  .energia-msg { color: #A03030; }
.energia-bubble.high .energia-msg { color: #2E7020; }
/* NUM COLORS */
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-label">Numerologia</div>
    <h1>Dzisiejsza<br><em>prognoza</em></h1>
    <div class="today-label" id="todayLabel"></div>
  </header>

  <div id="resultBox"></div>

  <div class="divider"></div>

  <div class="divider"></div>

  <div class="energia-check">
    <div class="energia-check-title">Jaka jest dzisiaj Twoja energia?</div>
    <div class="energia-check-sub">Oceń w skali od 1 do 10</div>
    <div class="energia-slider-row">
      <input type="number" id="energiaInput" min="1" max="10" placeholder="np. 7" oninput="checkEnergia()" />
    </div>
    <div class="energia-result" id="energiaResult"></div>
  </div>

</div>

<script>
const DNI = {"3-21":{"z":"Baran","l":7,"e":"Świat trochę przyspiesza, ale Ty możesz mieć ochotę zrobić krok w tył i… pobyć chwilę w swoim świecie. To nie jest ucieczka — to regeneracja Twojej głowy i serca.","r":"Zrób sobie chwilę tylko dla siebie","n":"Intuicja, Refleksja","u":"Porównań do innych","s":"„Twoje tempo jest naprawdę ok”"},"3-22":{"z":"Baran","l":8,"e":"Ooo, tu wchodzi konkret 🔥 Czujesz więcej mocy, odwagi i takiego „dobra, działamy”. Tylko pamiętaj — nie wszystko naraz, wybierz jedno i dowieź.","r":"Skup się na jednym celu","n":"Sukces, Decyzje","u":"Impulsywności","s":"„Moc z kierunkiem”"},"3-23":{"z":"Baran","l":9,"e":"Możesz dziś złapać moment „to już nie jest dla mnie”. I zamiast analizować w nieskończoność… po prostu to zauważ. To już jest krok dalej.","r":"Odpuszczaj bez tłumaczenia się","n":"Transformacja, Domykanie","u":"Upierania się przy starym","s":"„Nie wszystko na zawsze”"},"3-24":{"z":"Baran","l":1,"e":"Nowa energia wchodzi z drzwiami 😄 Taka świeża, trochę odważna, trochę szalona. Nie musisz mieć całego planu — wystarczy pierwszy ruch.","r":"Zacznij coś, co chodzi Ci po głowie","n":"Nowe projekty","u":"Zwlekania","s":"„Zrób pierwszy krok”"},"3-25":{"z":"Baran","l":2,"e":"Dzień bardziej subtelny niż się wydaje. Intuicja może szeptać cicho, ale bardzo konkretnie. Jeśli coś czujesz — to nie jest przypadek.","r":"Posłuchaj swojego wewnętrznego „hmm”","n":"Relacje, Intuicja","u":"Ignorowania sygnałów","s":"„Ty naprawdę wiesz”"},"3-26":{"z":"Baran","l":3,"e":"Flow w komunikacji — słowa same się układają, pomysły przychodzą szybciej, a ludzie jakoś lepiej reagują 😄 To dzień, żeby się pokazać.","r":"Mów, pisz, publikuj","n":"Kreatywność, Ekspresja","u":"Zamykania się","s":"„Powiedz to światu”"},"3-27":{"z":"Baran","l":4,"e":"Po kilku dynamicznych dniach przychodzi moment „ok, ogarniamy to wszystko”. I dobrze — bo struktura dziś daje Ci spokój.","r":"Zrób porządek (w głowie i wokół)","n":"Organizacja, Stabilność","u":"Chaosu","s":"„Poułóż i oddychaj lżej”"},"3-28":{"z":"Baran","l":5,"e":"Tu może się wydarzyć coś niespodziewanego — mała zmiana planów, inny kierunek, coś „nie tak jak miało być”… ale finalnie na plus 😉","r":"Bądź otwarta na zmianę","n":"Spontaniczność, Nowe doświadczenia","u":"Sztywnego trzymania się planu","s":"„Zaufaj temu skrętowi”"},"3-29":{"z":"Baran","l":6,"e":"Dzień relacyjny w najlepszym wydaniu. Rozmowy, śmiech, bycie razem — to dziś naprawdę ładuje baterie.","r":"Spędź czas z kimś ważnym","n":"Bliskość, Relacje","u":"Izolacji","s":"„Do ludzi, piękna”"},"3-30":{"z":"Baran","l":7,"e":"Jakby ktoś przyciszył świat. I to jest dokładnie to, czego możesz potrzebować. Mniej bodźców, więcej oddechu.","r":"Zwolnij bez wyrzutów sumienia","n":"Regeneracja, Wyciszenie","u":"Przeciążania się","s":"„Zatrzymaj się na chwilę”"},"3-31":{"z":"Baran","l":8,"e":"Koniec miesiąca z energią „wow, trochę się wydarzyło”. To dobry moment, żeby zobaczyć swoje efekty — nawet te małe.","r":"Zrób podsumowanie i doceń siebie","n":"Finanse, Strategia","u":"Pomijania swoich sukcesów","s":"„Zobacz swoją drogę”"},"4-1":{"z":"Baran","l":6,"e":"No dobrze… mamy tu miks: emocjonalna pełnia + Prima Aprilis 😄 Czyli trochę serca, trochę dramatu i trochę „czy to serio się dzieje?”. Możesz mieć wrażenie, że świat dziś robi małe psikusy – i w sumie… może robić 😉","r":"Zachowaj dystans i sprawdzaj dwa razy","n":"Relacje, Balans","u":"Pochopnych reakcji","s":"„Nie wszystko jest takie, jak wygląda”"},"4-2":{"z":"Baran","l":7,"e":"Po wczorajszym rollercoasterze przychodzi dzień typu „dajcie mi koc i święty spokój”. Głowa chce ciszy, serce też trochę odpocząć.","r":"Zrób sobie mentalny detoks","n":"Intuicja, Regeneracja","u":"Przebodźcowania","s":"„Zniknij na chwilę (to zdrowe)”"},"4-3":{"z":"Baran","l":8,"e":"Wjeżdża tryb: „ogarniam życie i jeszcze pół świata przy okazji” 😄 Energia konkretu, działania i robienia porządków — tych fizycznych i życiowych.","r":"Zrób większe porządki (dosłownie lub w głowie)","n":"Działanie, Finanse","u":"Przeciążenia się","s":"„Jedziesz z tematem”"},"4-4":{"z":"Baran","l":9,"e":"Trochę refleksji między jednym zadaniem a drugim. Możesz poczuć, że coś się kończy – i to dobrze, nawet jeśli trochę sentymentalnie.","r":"Odpuszczaj świadomie","n":"Domykanie spraw","u":"Trzymania się na siłę","s":"„Zamykam i idę dalej”"},"4-5":{"z":"Baran","l":1,"e":"Wielkanoc + energia nowego początku = vibe „nowa ja, ale w wersji spokojniejszej” 😄 To dobry moment na małe decyzje, które coś zmienią.","r":"Zrób symboliczny nowy start","n":"Nowe początki","u":"Odkładania","s":"„Od dziś trochę inaczej”"},"4-6":{"z":"Baran","l":2,"e":"Tu robi się magicznie ✨ (wcześniej 11) Możesz złapać nagłe olśnienie przy kawie, serniku albo… totalnie przypadkiem. Warto słuchać uważnie.","r":"Zapisuj pomysły (nawet te dziwne)","n":"Inspiracje, Intuicja","u":"Ignorowania „przeczuć”","s":"„To nie przypadek”"},"4-7":{"z":"Baran","l":3,"e":"Lekkość wraca 😄 Chce się gadać, śmiać i być wśród ludzi… albo przynajmniej wysłać kilka głosówek więcej niż zwykle.","r":"Daj sobie luz i kontakt z ludźmi","n":"Komunikacja, Radość","u":"Zamknięcia się","s":"„Trochę funu poproszę”"},"4-8":{"z":"Baran","l":4,"e":"No dobra, wracamy na ziemię 😄 Dzień typu: rachunki, lista rzeczy do zrobienia i „ogarniam, zanim mnie ogarnie”.","r":"Uporządkuj sprawy","n":"Organizacja","u":"Chaosu","s":"„Ogarnij to spokojnie”"},"4-9":{"z":"Baran","l":5,"e":"Plan? Jaki plan 😄 Dzień może Cię trochę zaskoczyć – coś się przesunie, zmieni albo nagle okaże się lepsze niż zakładałaś.","r":"Bądź elastyczna","n":"Zmiany, Spontaniczność","u":"Sztywności","s":"„Zobacz, gdzie Cię to poniesie”"},"4-10":{"z":"Baran","l":6,"e":"Ciepło, miękko, trochę wolniej. To dzień na przyjemności bez spiny – coś dla ciała, coś dla serca.","r":"Zadbaj o siebie (naprawdę)","n":"Relacje, Self-care","u":"Ignorowania swoich potrzeb","s":"„Zrób sobie dobrze (w dobrym sensie 😄)”"},"4-11":{"z":"Baran","l":7,"e":"Dziś możesz mieć vibe: „dajcie mi książkę, herbatę i święty spokój” 😄 Głowa chce myśleć głębiej, a nie szybciej. To dzień, w którym jedno zdanie może zmienić Twoje spojrzenie na wszystko.","r":"Zatrzymaj się i posłuchaj swoich myśli","n":"Intuicja, Nauka","u":"Przebodźcowania","s":"„Zajrzyj głębiej”"},"4-12":{"z":"Baran","l":8,"e":"Energia konkretu wraca – taka trochę „ogarniam życie, bo mogę”. Jeśli coś odkładałaś, to dziś masz idealny moment, żeby to domknąć.","r":"Zrób jedną ważną rzecz do końca","n":"Sukces, Działanie","u":"Zwlekania","s":"„Zrób to dzisiaj”"},"4-13":{"z":"Baran","l":9,"e":"Włącza się tryb: „chcę zrobić coś dobrego”. Może drobny gest, może większa sprawa – ale serce dziś wie, gdzie iść.","r":"Zrób coś dobrego dla kogoś","n":"Relacje, Empatia","u":"Obojętności","s":"„Dobro wraca (serio)”"},"4-14":{"z":"Baran","l":1,"e":"Okej, dziś możesz poczuć się jak szefowa swojego życia 😄 Decyzje przychodzą łatwiej, a energia mówi: „to Twój moment”.","r":"Zrób coś po swojemu","n":"Nowe początki","u":"Pytania innych o zgodę","s":"„Twoje życie, Twoje zasady”"},"4-15":{"z":"Baran","l":2,"e":"(wcześniej 11) Trochę bardziej subtelnie niż wczoraj. Możesz mieć większą wrażliwość i lepsze „czytanie między wierszami”.","r":"Słuchaj intuicji i ludzi","n":"Relacje, Wgląd","u":"Ignorowania emocji","s":"„Czuj uważnie”"},"4-16":{"z":"Baran","l":3,"e":"Dzień, w którym słowa mają moc 😄 Możesz coś załatwić uśmiechem, rozmową albo jednym dobrze trafionym zdaniem.","r":"Mów, pisz, wyrażaj się","n":"Komunikacja","u":"Duszenia w sobie","s":"„Powiedz to lekko”"},"4-17":{"z":"Baran","l":4,"e":"Nów + energia porządkowania = idealny moment na „od teraz robię inaczej”. To dzień na decyzje z planem.","r":"Spisz swoje intencje","n":"Planowanie, Fundamenty","u":"Chaosu","s":"„Zasiej to na serio”"},"4-18":{"z":"Baran","l":5,"e":"Po poważniejszych klimatach przychodzi ochota na ucieczkę 😄 Nawet mentalną. I w sumie… dobrze.","r":"Zrób coś, co daje Ci poczucie wolności","n":"Zmiany, Ruch","u":"Sztywnego planu","s":"„Oddech przede wszystkim”"},"4-19":{"z":"Baran","l":6,"e":"Możesz dziś być dla innych takim „ciepłym kocykiem” – wspierająca, obecna, uważna. Tylko nie zapomnij o sobie.","r":"Daj wsparcie, ale z granicą","n":"Relacje","u":"Brania za dużo na siebie","s":"„Pomagaj, ale nie kosztem siebie”"},"4-20":{"z":"Byk","l":7,"e":"Wchodzimy w energię Byka i od razu robi się… wolniej, zmysłowo, spokojniej. I dobrze. To dzień na docenienie prostych rzeczy.","r":"Zwolnij i poczuj chwilę","n":"Natura, Wyciszenie","u":"Pośpiechu","s":"„Smakuj życie”"},"4-21":{"z":"Byk","l":8,"e":"Byk + ósemka = konkret i pieniądze 😄 Dzień sprzyja rozmowom o finansach i decyzjom, które mają sens długoterminowo.","r":"Zajmij się sprawami finansowymi","n":"Finanse, Stabilność","u":"Ignorowania konkretów","s":"„Myśl przyszłościowo”"},"4-22":{"z":"Byk","l":4,"e":"(wcześniej 22) To dzień budowania czegoś większego. Może jeszcze nie widać efektu, ale fundament już się robi.","r":"Zrób coś, co zaprocentuje","n":"Długoterminowe plany","u":"Krótkowzroczności","s":"„Budujesz, nawet jeśli nie widać”"},"4-23":{"z":"Byk","l":1,"e":"Nowy początek, ale w stylu Byka: spokojnie, bez pośpiechu, za to konsekwentnie.","r":"Wprowadź jeden nowy nawyk","n":"Zdrowie, Rutyny","u":"Zrywu bez planu","s":"„Małe kroki, duża zmiana”"},"4-24":{"z":"Byk","l":2,"e":"Ciepły, relacyjny dzień. Trochę więcej przytulności, trochę mniej spinania się na wszystko.","r":"Bądź blisko (z kimś lub sobą)","n":"Relacje","u":"Dystansu emocjonalnego","s":"„Miękko wystarczy”"},"4-25":{"z":"Byk","l":3,"e":"Przyjemności level expert 😄 Jedzenie smakuje lepiej, muzyka brzmi ładniej, a śmiech przychodzi łatwiej.","r":"Zrób coś, co daje Ci radość","n":"Przyjemność, Kreatywność","u":"Ograniczania się","s":"„Korzystaj z życia”"},"4-26":{"z":"Byk","l":4,"e":"Dzień typu: „idziemy do natury albo robimy porządek”. Kontakt z ziemią robi dziś cuda (nawet doniczka się liczy 😄).","r":"Zrób coś fizycznego","n":"Dom, Natura","u":"Siedzenia cały dzień w głowie","s":"„Uziem się”"},"4-27":{"z":"Byk","l":5,"e":"Byk dotyku, bycia razem.","r":"Zadbaj o relacje","n":"Miłość, Dom","u":"Dystansu","s":"„Bądź bliżej”"},"5-14":{"z":"Byk","l":7,"e":"Trochę wolniej, trochę ciszej. To dzień, w którym warto zrobić krok w tył i zobaczyć większy obraz.","r":"Daj sobie czas na refleksję","n":"Intuicja, Wgląd","u":"Przebodźcowania","s":"„Zatrzymaj się i zobacz więcej”"},"5-15":{"z":"Byk","l":8,"e":"Wraca energia działania — konkretna, stabilna, taka „robię i mam”. Idealny moment na decyzje finansowe lub zawodowe.","r":"Podejmij jedną ważną decyzję","n":"Finanse, Praca","u":"Zwlekania","s":"„Decyduj i działaj”"},"5-16":{"z":"Byk","l":9,"e":"Możesz dziś poczuć lekki sentyment… albo potrzebę zamknięcia czegoś raz na dobre. I to jest dobry kierunek.","r":"Domknij coś świadomie","n":"Emocje, Transformacja","u":"Wracania do przeszłości","s":"„To już było”"},"5-17":{"z":"Byk","l":1,"e":"Nowy impuls, ale bez presji. To dzień typu „spróbuję inaczej” — i to wystarczy.","r":"Zrób coś po nowemu","n":"Nowe początki","u":"Perfekcjonizmu","s":"„Nie musi być idealnie”"},"5-18":{"z":"Byk","l":2,"e":"Bardziej miękko i emocjonalnie. Możesz być dziś bardziej wyczulona na energię ludzi — wybieraj mądrze, z kim jesteś.","r":"Dbaj o swoje granice","n":"Relacje, Intuicja","u":"Toksycznych sytuacji","s":"„Nie dla każdego masz dostęp”"},"5-19":{"z":"Byk","l":3,"e":"Lekkość, śmiech, trochę flirtu z życiem 😄 To dzień, w którym wszystko może być odrobinę przyjemniejsze.","r":"Daj sobie przyjemność","n":"Radość, Kreatywność","u":"Sztywności","s":"„Baw się tym dniem”"},"5-20":{"z":"Byk","l":4,"e":"Dzień stabilizacji. Możesz poczuć potrzebę „ustawienia” kilku rzeczy — i dobrze, to daje Ci spokój.","r":"Uporządkuj swoje sprawy","n":"Planowanie, Dom","u":"Chaosu","s":"„Spokój zaczyna się od porządku”"},"5-21":{"z":"Bliźnięta","l":5,"e":"Wchodzimy w energię Bliźniąt i od razu robi się lżej 😄 Więcej ruchu, więcej rozmów, więcej ciekawości świata.","r":"Wyjdź do ludzi lub świata","n":"Komunikacja, Zmiany","u":"Nudy","s":"„Rusza się!”"},"5-22":{"z":"Bliźnięta","l":6,"e":"W tej lekkości pojawia się potrzeba bliskości. Dzień na rozmowy, które coś wnoszą — nawet jeśli zaczynają się od „a tak w ogóle…”","r":"Rozmawiaj szczerze","n":"Relacje","u":"Powierzchowności","s":"„Powiedz trochę więcej”"},"5-23":{"z":"Bliźnięta","l":7,"e":"Mały stop w tej całej aktywności. Głowa potrzebuje chwili ciszy, żeby to wszystko poukładać.","r":"Zrób pauzę","n":"Refleksja, Wgląd","u":"Nadmiaru bodźców","s":"„Zatrzymaj się na moment”"},"5-24":{"z":"Bliźnięta","l":8,"e":"Wraca konkret — możesz dziś ogarnąć coś szybko i skutecznie. Energia sprzyja działaniu „tu i teraz”.","r":"Działaj bez analizowania w nieskończoność","n":"Sukces, Decyzje","u":"Przeciągania","s":"„Rób, nie myśl za długo”"},"5-25":{"z":"Bliźnięta","l":9,"e":"Możesz złapać refleksję: co już Ci nie pasuje do tej wersji Ciebie? I to jest bardzo cenne pytanie.","r":"Odpuszczaj stare schematy","n":"Transformacja","u":"Trzymania się przeszłości","s":"„Zostaw to za sobą”"},"5-26":{"z":"Bliźnięta","l":1,"e":"Dzień Mamy 💛 + energia nowego początku = coś miękkiego i ważnego jednocześnie. Możesz poczuć potrzebę nowego otwarcia w relacjach.","r":"Zrób pierwszy krok w relacji","n":"Relacje, Emocje","u":"Dumy","s":"„Zacznij od serca”"},"5-27":{"z":"Bliźnięta","l":2,"e":"Delikatność wraca. To dzień na uważność — na słowa, na ludzi, na siebie.","r":"Słuchaj więcej niż mówisz","n":"Intuicja, Relacje","u":"Pośpiechu w rozmowach","s":"„Usłysz to naprawdę”"},"5-28":{"z":"Bliźnięta","l":3,"e":"Lekko, przyjemnie, trochę żartobliwie 😄 Idealny dzień na spotkania, rozmowy i bycie „wśród”.","r":"Wyjdź do ludzi","n":"Komunikacja, Fun","u":"Izolacji","s":"„Daj się ponieść rozmowie”"},"5-29":{"z":"Bliźnięta","l":4,"e":"Po lekkich dniach przychodzi potrzeba struktury. To dobry moment, żeby coś uporządkować i złapać rytm.","r":"Zrób plan na najbliższe dni","n":"Organizacja","u":"Chaosu","s":"„Ułóż to po swojemu”"},"5-30":{"z":"Bliźnięta","l":5,"e":"Energia zmiany — możesz mieć och   const dane = DNI[key];
  const box = document.getElementById('resultBox');

  if (!dane) {
    box.innerHTML = `<div class="no-data">Brak danych dla tej daty.<br>Dostępne dni: 21 marca — 31 grudnia.</div>`;
    return;
  }

  const bg = NUM_BG[dane.l] || '#6A6A62';
  const name = NUM_NAMES[dane.l] || '';

  box.innerHTML = `
  <div class="card">
    <div class="card-top">
      <div class="number-circle" style="background:${bg}">${dane.l}</div>
      <div class="card-top-meta">
        <div class="card-zodiak">${dane.z}</div>
        <div class="card-number-name">Liczba ${dane.l} · ${name}</div>
      </div>
    </div>
    <div class="card-body">
      <p class="energia">${dane.e}</p>
      <div class="grid2">
        <div class="ibox">
          <div class="ibox-label">Co warto robić</div>
          <div class="ibox-val">${dane.r}</div>
        </div>
        <div class="ibox">
          <div class="ibox-label">Najlepsze dla</div>
          <div class="ibox-val">${dane.n}</div>
        </div>
      </div>
      <div class="unikaj">
        <div class="ibox-label">Unikaj dziś</div>
        <div class="ibox-val">${dane.u}</div>
      </div>
    </div>
    <div class="slogan">${dane.s}</div>
  </div>`;
}

function sprawdz() {
  const d = today();
  document.getElementById('todayLabel').textContent = fmtDate(d);
  render(d);
}

function checkEnergia() {
  const val = parseInt(document.getElementById('energiaInput').value);
  const box = document.getElementById('energiaResult');
  if (!val || val < 1 || val > 10) { box.innerHTML = ''; return; }
  const low = val <= 6;
  box.innerHTML = `
    <div class="energia-bubble ${low ? 'low' : 'high'}">
      <div class="energia-icon">${low ? '👎' : '👍'}</div>
      <div class="energia-msg">${low ? 'Zadbaj dzisiaj o siebie' : 'Tak trzymaj!'}</div>
    </div>`;
}

// Init
const t = today();

document.getElementById('todayLabel').textContent = fmtDate(t);
render(t);
</script>
</body>
</html>
